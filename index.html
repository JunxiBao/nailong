<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>奶龙消消乐：大肚肚美食派对 (Pixel Edition)</title>
    <script>
      // Apply the player's furthest reached chapter background immediately (before the game bundle loads)
      try {
        var save = JSON.parse(localStorage.getItem('nailong_match3_save_v1') || '{}');
        var isAllClear = (Number(save.unlockedLevel) > 50) || (save.levelStars && save.levelStars[50] > 0);
        if (isAllClear) {
          document.documentElement.className = 'theme-all-clear';
          if (document.body) document.body.className = 'theme-all-clear';
        } else {
          var chap = Math.min(5, Math.max(1, Math.ceil((Number(save.unlockedLevel) || 1) / 10)));
          document.documentElement.className = 'theme-chap-' + chap;
          if (document.body) document.body.className = 'theme-chap-' + chap;
        }
      } catch (e) {
        document.documentElement.className = 'theme-chap-1';
        if (document.body) document.body.className = 'theme-chap-1';
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
